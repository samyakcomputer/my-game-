
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samyak Bulk SMS</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:25px auto;
padding:16px;background:#f3f6fb;color:#172033}
main{background:white;padding:22px;border-radius:14px}
textarea,input{box-sizing:border-box;width:100%;padding:12px;
margin:8px 0 16px;border:1px solid #bbc5d5;border-radius:8px}
textarea{min-height:130px}
button{padding:12px;border:0;border-radius:8px;
background:#1769e0;color:white;font-weight:bold;cursor:pointer}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h2>Samyak Computer Classes</h2>
<p>Bulk SMS Sender</p>

<label>Worker URL</label>
<input id="worker" type="url" placeholder="https://your-worker.workers.dev">

<label>Admin PIN</label>
<input id="pin" type="password" autocomplete="off">

<label>बच्चों के मोबाइल नंबर (हर लाइन पर एक)</label>
<textarea id="numbers" placeholder="9876543210&#10;9123456780"></textarea>

<label>मैसेज (DLT-approved template से मेल खाना चाहिए)</label>
<textarea id="message" placeholder="अपना स्वीकृत SMS template यहाँ लिखें"></textarea>

<p id="count">0 नंबर</p>
<button id="send">SMS भेजें</button>
<pre id="status"></pre>
</main>

<script>
const numbers = document.getElementById("numbers");
const count = document.getElementById("count");
const status = document.getElementById("status");
const send = document.getElementById("send");

function getNumbers() {
  return [...new Set(numbers.value.split(/[\n,;]+/)
    .map(s => s.trim()).filter(Boolean))];
}
numbers.addEventListener("input", () => {
  count.textContent = getNumbers().length + " नंबर";
});

send.addEventListener("click", async () => {
  const worker = document.getElementById("worker").value.trim();
  const pin = document.getElementById("pin").value;
  const list = getNumbers();
  const message = document.getElementById("message").value.trim();

  if (!worker.startsWith("https://")) {
    status.textContent = "Worker का सही HTTPS URL डालें।";
    return;
  }
  if (!pin || !message || !list.length) {
    status.textContent = "PIN, नंबर और मैसेज भरें।";
    return;
  }
  if (list.length > 500) {
    status.textContent = "एक बार में अधिकतम 500 नंबर रखें।";
    return;
  }

  const confirmSend = confirm(
    list.length + " नंबरों पर SMS भेजने की API प्रक्रिया शुरू करें?\n" +
    "शुल्क लग सकता है। नंबरों और template की जाँच कर लें।"
  );
  if (!confirmSend) return;

  send.disabled = true;
  status.textContent = "प्रक्रिया चल रही है। कृपया पेज बंद न करें...";
  try {
    const response = await fetch(worker, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Admin-Pin": pin
      },
      body: JSON.stringify({numbers: list, message})
    });
    const result = await response.json();
    status.textContent = JSON.stringify(result, null, 2);
  } catch (error) {
    status.textContent =
      "Request पूरी नहीं हुई। URL/CORS जाँचें। " +
      "पहले provider dashboard में देखें कि SMS भेजे गए हैं या नहीं।";
  } finally {
    send.disabled = false;
  }
});
</script>
</body>
</html>
